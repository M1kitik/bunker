    messy:`M${T(34,45)} L${T(32,34)} L${T(37,35)} L${T(36,25)} L${T(42,29)} L${T(44,19)} L${T(49,26)} L${T(54,18)} L${T(57,26)} L${T(63,21)} L${T(63,30)} L${T(68,31)} L${T(66,45)} C${T(63,36)} ${T(58,32)} ${T(52,32)} C${T(47,35)} ${T(40,33)} ${T(34,45)} Z`,
    pigtails:`M${T(34,46)} C${T(33,27)} ${T(41,22)} ${T(50,22)} C${T(59,22)} ${T(67,27)} ${T(66,46)} C${T(63,35)} ${T(57,30)} ${T(50,32)} C${T(43,30)} ${T(37,35)} ${T(34,46)} Z`,
    curly:'',
    beanie:`M${T(33,42)} C${T(32,22)} ${T(68,22)} ${T(67,42)} Z`,
  };
  if(hb==='curly'){ for(let i=0;i<15;i++){ const a=Math.PI*(1.02+i/14*0.96), x=50+Math.cos(a)*16.5, y=40+Math.sin(a)*17; s+=`<circle cx="${T(x,0).split(' ')[0]}" cy="${T(0,y).split(' ')[1]}" r="${4.2*hs}" fill="${i%2?hcol:hD}"/>`; } }
  else if(H[hb]) s+=`<path d="${H[hb]}" fill="${hb==='beanie'?hcol:hcol}" ${hb==='buzz'?'opacity=".85"':''}/>`;
  if(hb==='beanie') s+=`<rect x="${T(32.5,0).split(' ')[0]}" y="${T(0,37).split(' ')[1]}" width="${35*hs}" height="${6*hs}" rx="2" fill="${hL}"/><circle cx="${T(50,0).split(' ')[0]}" cy="${T(0,22).split(' ')[1]}" r="${3*hs}" fill="${hL}"/>${[0,1,2,3,4,5,6].map(k=>`<path d="M${T(35+k*5,38)} L${T(35+k*5,42.5)}" stroke="${hD}" stroke-width=".6"/>`).join('')}`;
  if(['short','bun','ponytail','long','pigtails','greybun'].includes(hb)) s+=`<path d="M${T(44,25)} Q${T(50,23)} ${T(57,26)}" stroke="${hL}" stroke-width="1.1" fill="none" opacity=".7"/>`;
  if(hb==='balding') s+=`<ellipse cx="${T(47,0).split(' ')[0]}" cy="${T(0,28).split(' ')[1]}" rx="${4*hs}" ry="${2*hs}" fill="#fff" opacity=".25"/><path d="M${T(44,26)} q3 -2 6 0 M${T(47,25)} q3 -1.5 6 .5" stroke="${hcol}" stroke-width=".5" fill="none"/>`;
  // очки
  if(L.glasses==='round') s+=[44,56].map(ex=>{ const [cx,cy]=T(ex,47).split(' '); return `<circle cx="${cx}" cy="${cy}" r="${4.6*hs}" fill="rgba(200,220,240,.12)" stroke="#2a2a2a" stroke-width="1"/>`; }).join('')+`<path d="M${T(48.6,47)} L${T(51.4,47)} M${T(39.4,46.5)} L${T(35,45)} M${T(60.6,46.5)} L${T(65,45)}" stroke="#2a2a2a" stroke-width="1"/>`;
  if(L.glasses==='half') s+=[44,56].map(ex=>{ const [cx,cy]=T(ex,48.5).split(' '); return `<path d="M${(+cx-4.4).toFixed(1)} ${cy} Q${cx} ${(+cy+5).toFixed(1)} ${(+cx+4.4).toFixed(1)} ${cy} Z" fill="rgba(200,220,240,.15)" stroke="#8a6a2a" stroke-width=".9"/>`; }).join('')+`<path d="M${T(48.4,48.5)} L${T(51.6,48.5)}" stroke="#8a6a2a" stroke-width=".9"/><path d="M${T(35,48)} C${T(32,66)} ${T(38,78)} ${T(44,84)} M${T(65,48)} C${T(68,66)} ${T(62,78)} ${T(56,84)}" stroke="#c9a227" stroke-width=".5" fill="none" stroke-dasharray="1 .8"/>`;
  // состояние: болезнь, ранения, мигрень
  if(mood==='sick'){ s+=`<path d="M${T(35,44)} C${T(35,60)} ${T(42,68)} ${T(50,69)} C${T(58,68)} ${T(65,60)} ${T(65,44)} C${T(65,29)} ${T(58,24)} ${T(50,24)} C${T(42,24)} ${T(35,29)} ${T(35,44)} Z" fill="#9ad08a" opacity=".22"/>`;
    s+=`<path class="pt-drop" d="M${T(62,34)} q-1.4 2.6 0 3.6 q1.4 -1 0 -3.6 Z" fill="#bfe4ff" opacity=".9"/><path d="M${T(38,36)} q-1.2 2.2 0 3 q1.2 -.8 0 -3 Z" fill="#bfe4ff" opacity=".7"/>`; }
  if(p.hp<40) s+=`<path d="M${T(34,35)} Q${T(50,31)} ${T(66,35)} L${T(66,39.5)} Q${T(50,35.5)} ${T(34,39.5)} Z" fill="#f2efe8" stroke="#d8d4cc" stroke-width=".4"/><circle cx="${T(58,0).split(' ')[0]}" cy="${T(0,36.5).split(' ')[1]}" r="${1.4*hs}" fill="#c0392b" opacity=".75"/>`;
  else if(p.hp<70) s+=`<rect x="${T(56.5,0).split(' ')[0]}" y="${T(0,53).split(' ')[1]}" width="${5.4*hs}" height="${2.4*hs}" rx="1" fill="#e8c8a0" transform="rotate(-20 ${T(59,54).replace(' ',' ')})"/>`;
  if(mood==='pain') s+=`<path class="pt-throb" d="M${T(29,36)} l-3 -2 M${T(29,40)} l-3.6 0 M${T(29,44)} l-3 2" stroke="#ff8a7a" stroke-width="1" stroke-linecap="round"/>`;
  s+=`</g>`; // голова
  // противогаз на вылазке
  if(p.away){ const [mx,my]=T(50,55).split(' ');
    s+=`<path d="M${T(35,40)} C${T(33,62)} ${T(42,72)} ${T(50,72)} C${T(58,72)} ${T(67,62)} ${T(65,40)} C${T(60,36)} ${T(40,36)} ${T(35,40)} Z" fill="#3a4440"/>
      ${[44,56].map(ex=>{ const [cx,cy]=T(ex,47).split(' '); return `<circle cx="${cx}" cy="${cy}" r="${4.6*hs}" fill="#a8bcb8" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="${(+cx+1.2).toFixed(1)}" cy="${(+cy-1.2).toFixed(1)}" r="${1.2*hs}" fill="#fff" opacity=".6"/>`; }).join('')}
      <rect x="${(+mx-5).toFixed(1)}" y="${(+my+2).toFixed(1)}" width="10" height="10" rx="2.5" fill="#55605a"/><rect x="${(+mx-4).toFixed(1)}" y="${(+my+4).toFixed(1)}" width="8" height="1" fill="#2a302c"/><rect x="${(+mx-4).toFixed(1)}" y="${(+my+7).toFixed(1)}" width="8" height="1" fill="#2a302c"/>
      <path d="M${T(34,34)} C${T(36,18)} ${T(64,18)} ${T(66,34)}" stroke="#2a2a2a" stroke-width="2.4" fill="none"/>`; }
  s+=`</g>`; // дыхание
  if(p.locked) s+=`<rect width="100" height="120" fill="#000" opacity=".35"/>${[14,30,46,62,78].map(x=>`<rect x="${x}" y="0" width="5" height="120" fill="#4a4f54"/><rect x="${x}" y="0" width="1.4" height="120" fill="#8a9096"/>`).join('')}<rect x="0" y="54" width="100" height="5" fill="#4a4f54"/>`;
  s+=`<rect width="100" height="120" rx="14" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/></g>`;
  return `<svg class="ptr${mood==='sick'?' sick':''}${kid?' kid':''}" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p.name}">${s}</svg>`;
}
function openPortrait(name){
  const p=P(name); if(!p) return; const pr=PROFS[p.prof]||{n:p.prof,i:'👤'}, tr=TRAITS[p.trait], known=tr&&traitKnown(p);
  const mood={smile:'Держится бодро',calm:'Спокоен(на)',sad:'Подавлен(а)',hurt:'Ранен(а)',sick:'Болеет',pain:'Мучает мигрень'}[ptMood(p)];
  const d=document.createElement('div'); d.className='ptmodal'; d.onclick=()=>d.remove();
  d.innerHTML=`<div class="ptbox" onclick="event.stopPropagation()"><div class="ptbig">${portraitSVG(p,true)}</div>
    <h2 style="margin:12px 0 2px">${p.name}</h2><p class="small dim">${pr.i} ${pr.n}${pr.room?' · ★ '+ROOMS[pr.room].name:''}</p>
    <p style="margin:10px 0">${PT_BIO[p.name]||'Пришёл(ла) в бункер в первые дни. О прошлом говорит мало.'}</p>
    <p class="small">${known?tr.i+' <b>'+tr.n+'</b> — '+tr.d:'❔ Характер пока не ясен'}</p>
    <p class="small" style="margin-top:6px">❤ ${p.hp} · ${p.away?'🗺 на вылазке':p.locked?'🔒 под замком':mood}</p>
    <button class="main" style="margin-top:14px" onclick="this.closest('.ptmodal').remove()">Закрыть</button></div>`;
  document.body.append(d); haptic('light');
}

load(raw=>{
  let saved=null;
  try{ saved = raw ? JSON.parse(raw) : null; }catch(e){}
  if(saved && saved.screen && saved.screen!=='ending' && saved.screen!=='pick'){
    S = migrate(saved); S.screen_prev = saved.screen; S.screen='title';
  } else {
    S = newState(); S.screen='start';
  }
  render();
});

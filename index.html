<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>БУНКЕР</title>
<!-- Скрипт Telegram: внутри Telegram даёт доступ к облачным сохранениям и вибрации.
     В обычном браузере просто ничего не делает. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090b11; --glass:rgba(255,255,255,.06); --gline:rgba(255,255,255,.1); --text:#eef0f6;
    --dim:#9097a8; --acc:#ff8a3d; --acc2:#28dcbe; --warn:#ffb340; --bad:#ff5d5d; --good:#7be36a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden}
  body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
  body::before{width:340px;height:340px;left:-120px;top:-100px;background:radial-gradient(circle,rgba(255,122,48,.35),transparent 70%)}
  body::after{width:320px;height:320px;right:-140px;top:45%;background:radial-gradient(circle,rgba(40,220,190,.2),transparent 70%)}
  #app{max-width:520px;margin:0 auto;padding:0 14px 40px;position:relative;z-index:1}
  #app.tabs-on{padding-bottom:150px}
  h1{font-family:Unbounded,sans-serif;font-size:30px;letter-spacing:3px;margin:36px 0 4px}
  h2{font-family:Unbounded,sans-serif;font-size:17px;margin:16px 0 8px}
  p{margin:6px 0}
  .dim{color:var(--dim)} .small{font-size:13px}
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .card{background:var(--glass);border:1px solid var(--gline);border-radius:18px;padding:14px;margin:10px 0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  button{font-family:inherit;font-size:15px;font-weight:600;background:var(--glass);color:var(--text);border:1px solid var(--gline);border-radius:14px;padding:13px 14px;width:100%;margin:5px 0;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .08s}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.35;cursor:default}
  button.main{background:linear-gradient(90deg,#ff7a30,#ff9a4a);color:#170c05;border:none;justify-content:center;font-weight:800;box-shadow:0 6px 20px rgba(255,122,48,.3)}
  button.sel{border-color:var(--acc);background:rgba(255,138,61,.14)}
  .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.25);border-radius:9px;padding:3px 8px;white-space:nowrap}
  button.main .tag{background:rgba(0,0,0,.15)}
  .blink{animation:b 1s steps(2) infinite} @keyframes b{50%{opacity:0}}
  .log li{margin:6px 0 6px 18px}

  /* шапка и кольца ресурсов */
  .hud{position:sticky;top:0;z-index:5;padding:10px 0 8px;background:linear-gradient(var(--bg) 75%,rgba(9,11,17,0))}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .topbar b{font-family:Unbounded;font-size:17px}
  .chips{display:flex;gap:6px;align-items:center}
  .chip{background:var(--glass);border:1px solid var(--gline);border-radius:20px;padding:4px 10px;font-size:12px;white-space:nowrap}
  .chip.btn{cursor:pointer;width:auto;margin:0;padding:4px 9px}
  .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .ring{background:var(--glass);border:1px solid var(--gline);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:8px}
  .ring .rg{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
  .ring .rg::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#14161e}
  .ring .rg i{position:relative;z-index:1;font-style:normal;font-size:12px}
  .ring b{font-size:14px;line-height:1;display:block}
  .ring span{font-size:10px;color:var(--dim)}
  .ring.warn{border-color:rgba(255,179,64,.5)} .ring.bad{border-color:rgba(255,93,93,.6);background:rgba(255,93,93,.08)}

  /* карточка события */
  .ev{border-radius:20px;overflow:hidden;background:var(--glass);border:1px solid var(--gline);margin:8px 0}
  .ev .art{height:150px;position:relative;display:grid;place-items:center;font-size:64px}
  .ev .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,11,17,0) 40%,rgba(20,22,30,1))}
  .ev .art span{position:relative;z-index:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .ev .art em{position:absolute;left:14px;top:12px;z-index:2;font-style:normal;font-size:11px;font-weight:800;background:var(--acc);color:#140a04;border-radius:10px;padding:3px 9px}
  .ev .body{padding:4px 16px 14px}
  .ev h3{font-family:Unbounded;font-size:18px;margin-bottom:6px}
  .ev .body p{color:#c3c7d4;font-size:14px}

  /* отсеки */
  .room-card{display:flex;align-items:center;gap:12px}
  .room-ico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:20px;flex:none}
  .room-info{flex:1;min-width:0}
  .room-info b{display:block;font-size:15px}
  .room-info span{font-size:12px;color:var(--dim)}
  .pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
  .pips i{width:7px;height:7px;border-radius:2px;background:#2c303c}.pips i.on{background:var(--acc)}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:34px;height:34px;padding:0;margin:0;border-radius:11px;justify-content:center;font-size:18px}
  .stepper b{min-width:34px;text-align:center;font-size:14px}
  .out{font-size:12px;font-weight:700;color:var(--good);background:rgba(123,227,106,.1);border-radius:8px;padding:2px 7px;margin-left:6px}
  .forecast{display:flex;flex-wrap:wrap;gap:6px}
  .forecast .chip b{font-weight:800}

  /* нижняя панель */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,16,23,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--gline);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:520px;margin:0 auto}
  .dock .main{margin:0 0 8px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
  .tabbar div{font-size:10px;color:#7d8394;cursor:pointer;padding:2px 0}
  .tabbar div b{display:block;font-size:19px;margin-bottom:1px;filter:grayscale(1);opacity:.6}
  .tabbar div.on{color:var(--acc)} .tabbar div.on b{filter:none;opacity:1}
  .person{display:flex;gap:12px;align-items:flex-start;position:relative}
  .av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
  .pinfo{flex:1;min-width:0}
  .pname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .pname b{font-size:16px}
  .ptags{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 2px}
  .ptag{font-size:11px;font-weight:700;background:rgba(255,255,255,.08);border-radius:8px;padding:2px 7px}
  .ptag.bad{background:rgba(255,93,93,.18);color:#ff9c9c}
  .hpbar{height:5px;border-radius:3px;background:#2a2c35;margin:8px 0;overflow:hidden}
  .hpbar i{display:block;height:100%;border-radius:3px}
  .hp{position:absolute;right:14px;top:14px;font-size:12px;font-weight:800}
  select.job{width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--gline);border-radius:12px;padding:9px 10px;appearance:none;-webkit-appearance:none}
  select.job option{background:#14161e;color:#eef0f6}
  .startscr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
  .startscr .glow{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,40,.35),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
  .startscr .kicker{font-size:11px;font-weight:800;letter-spacing:6px;color:var(--dim);position:relative}
  .startscr .big{font-size:48px;letter-spacing:4px;margin:6px 0 10px;position:relative;text-shadow:0 0 30px rgba(255,138,61,.5)}
  .startscr .tap{margin:36px 0 10px;font-weight:800;font-size:16px;color:#170c05;background:linear-gradient(90deg,#ff7a30,#ff9a4a);padding:14px 26px;border-radius:30px;position:relative;animation:tap 1.6s ease-in-out infinite;box-shadow:0 6px 24px rgba(255,122,48,.35)}
  @keyframes tap{50%{transform:scale(1.05)}}
  .jr{border-left:2px solid var(--acc);padding:2px 0 2px 12px;margin:12px 0}
  .jr small{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:1px}
  .jr b{display:block;margin:2px 0}
  .jr p{font-size:13px;color:#c3c7d4}
  /* Заставка */
  #cut{position:fixed;inset:0;width:100vw;height:100vh;z-index:100;background:#000;transition:opacity .6s}
  #skip{position:fixed;right:12px;bottom:16px;z-index:101;width:auto;padding:8px 14px;background:rgba(0,0,0,.5);border-color:#555;color:#aaa;font-size:13px;border-radius:20px}
  /* Бункер в разрезе */
  .bunker{margin:10px 0;border:1px solid var(--gline);border-radius:18px;overflow:hidden;background:#0b0a08}
  .bunker svg{display:block;width:100%;height:auto}
  .bunker .room{cursor:pointer}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
  .spin.slow{animation-duration:3.5s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-1.5px)}}
  .bubble{animation:bubble 2.2s ease-in infinite;opacity:0}
  @keyframes bubble{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
  .blinkf{animation:blinkf 1.1s steps(2) infinite}
  @keyframes blinkf{50%{opacity:.15}}
  .flicker{animation:flicker 2.3s infinite}
  @keyframes flicker{0%,100%{opacity:1}8%{opacity:.2}10%{opacity:.9}45%{opacity:.7}47%{opacity:.1}50%{opacity:.8}}
  .sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(6deg)}}
  .ash{animation:ash 6s linear infinite}
  @keyframes ash{from{transform:translate(0,-6px)}to{transform:translate(-14px,52px)}}
  .arm{transform-box:fill-box;transform-origin:top center;animation:arm .7s ease-in-out infinite alternate}
  @keyframes arm{to{transform:rotate(-55deg)}}
  .needle{transform-box:fill-box;transform-origin:bottom center;animation:needle 2.6s ease-in-out infinite}
  @keyframes needle{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(30deg)}}
  .drip{animation:drip 1.6s ease-in infinite}
  @keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(5px);opacity:0}}
  .suck{animation:suck 2s linear infinite}
  @keyframes suck{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(26px,-6px);opacity:0}}
  .flow{animation:flow .8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .breath{transform-box:fill-box;transform-origin:bottom center;animation:breath 2.4s ease-in-out infinite}
  @keyframes breath{50%{transform:scaleY(1.12)}}
  .scan{animation:scan 1.6s linear infinite}
  @keyframes scan{from{transform:translateX(0)}to{transform:translateX(-10px)}}
  .vu{transform-box:fill-box;transform-origin:bottom center;animation:vu .5s ease-in-out infinite alternate}
  @keyframes vu{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
  .card.hl,.chip.hl{border-color:var(--acc);box-shadow:0 0 0 2px rgba(255,138,61,.4)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   1. TELEGRAM И СОХРАНЕНИЯ
   ========================================================= */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);           // true только если игра открыта внутри Telegram
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

function haptic(type){ try{ if(inTG) tg.HapticFeedback.impactOccurred(type||'light'); }catch(e){} }

const SAVE_KEY = 'bunker_save_v1';
function lsGet(){ try{ return localStorage.getItem(SAVE_KEY); }catch(e){ return null; } }
function save(){
  const data = JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY, data); }catch(e){}
  try{ if(inTG && tg.CloudStorage) tg.CloudStorage.setItem(SAVE_KEY, data, ()=>{}); }catch(e){}
}
function load(cb){
  try{
    if(inTG && tg.CloudStorage){
      tg.CloudStorage.getItem(SAVE_KEY, (err, val)=> cb(!err && val ? val : lsGet()));
      return;
    }
  }catch(e){}
  cb(lsGet());
}
function wipe(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  try{ if(inTG && tg.CloudStorage) tg.CloudStorage.removeItem(SAVE_KEY, ()=>{}); }catch(e){}
}

/* =========================================================
   2. ДАННЫЕ ИГРЫ: отсеки, люди, предметы, концовки
   ========================================================= */
const ROOMS = {
  generator:{name:'⚡ Генератор',      desc:'Даёт энергию всему бункеру', cost:0,  per:4,  res:'energy',    use:0},
  water:    {name:'💧 Водоочистка',    desc:'Очищает воду',               cost:0,  per:4,  res:'water',     use:1},
  filter:   {name:'🌀 Фильтр воздуха', desc:'Снижает радиацию',           cost:0,  per:2,  res:'rad',       use:2},
  farm:     {name:'🌱 Гидропоника',    desc:'Выращивает еду',             cost:8,  per:4,  res:'food',      use:2},
  workshop: {name:'🛠 Мастерская',     desc:'Делает материалы',           cost:4,  per:3,  res:'materials', use:1},
  medbay:   {name:'➕ Медпункт',       desc:'Лечит больных и раненых',    cost:12, per:15, res:'heal',      use:1},
  radio:    {name:'📻 Радиорубка',     desc:'Ловит и усиливает сигнал',   cost:15, per:1,  res:'signal',    use:1},
};
const MAX_LVL = 3;

// Профессии: работа «по специальности» даёт ×1.5
const PROFS = {
  boss:    {n:'Командир',  i:'🎖', room:null},
  electric:{n:'Электрик',  i:'🔌', room:'generator'},
  medic:   {n:'Медсестра', i:'🩺', room:'medbay'},
  farmer:  {n:'Агроном',   i:'🌾', room:'farm'},
  mechanic:{n:'Механик',   i:'🔧', room:'workshop'},
  plumber: {n:'Сантехник', i:'🚰', room:'water'},
  child:   {n:'Ребёнок',   i:'🧸', room:null},
};
// Черты характера
const TRAITS = {
  leader: {n:'Лидер',   i:'⭐', d:'+1 мораль каждый день'},
  worker: {n:'Трудяга', i:'💪', d:'+25% к работе'},
  lazy:   {n:'Лентяй',  i:'😴', d:'−25% к работе'},
  glutton:{n:'Обжора',  i:'🍖', d:'Ест вдвое больше'},
  tough:  {n:'Крепкий', i:'🛡', d:'Радиация и раны вредят вдвое меньше'},
  sickly: {n:'Хилый',   i:'🤧', d:'Чаще болеет и дольше выздоравливает'},
  coward: {n:'Трус',    i:'😰', d:'Может струсить на вылазке'},
  thief:  {n:'Вор',     i:'🦝', d:'Тайком таскает еду', hidden:true},
};
const ADULT_TRAITS = ['worker','worker','lazy','glutton','tough','tough','sickly','coward','thief'];
const CHILD_TRAITS = ['coward','sickly','tough','glutton','worker'];
const AV_COLORS = ['#ff8a3d','#4ab8ff','#7be36a','#ff7aa8','#b58ad8','#ffd23a','#28dcbe','#e0e0e0'];

const ITEMS = [
  {id:'food',   name:'🥫 Ящик консервов',  desc:'+15 еды'},
  {id:'water',  name:'🚰 Канистры с водой', desc:'+15 воды'},
  {id:'tools',  name:'🧰 Инструменты',      desc:'+10 материалов'},
  {id:'meds',   name:'💊 Аптечка',          desc:'+15 морали, все здоровы'},
  {id:'radio',  name:'📻 Радиоприёмник',    desc:'Радиорубка сразу построена'},
  {id:'filter', name:'🌀 Запасной фильтр',  desc:'Фильтр воздуха сразу 2 уровня'},
];

const ENDINGS = {
  silence:{title:'ТИШИНА', text:'Последний фонарь погас. В бункере больше никто не дышит. Через много лет его найдут — по записям в журнале, который ты вёл до конца.'},
  mutiny: {title:'БУНТ',   text:'Ночью они пришли все вместе. Тебя вывели за шлюз и закрыли дверь. Бункер теперь принадлежит другим — и, может быть, они справятся лучше.'},
  surface:{title:'ВЫХОД НА ПОВЕРХНОСТЬ', text:'Шлюз открывается впервые за много дней. Серое небо, пепел под ногами. Вы идёте на север — туда, где «Заря» держит для вас огонь.'},
  secret: {title:'ПРАВДА В ЭФИРЕ', text:'Ты зачитываешь в микрофон документы «Полдня». Удар не был ответным. Тысячи приёмников в тысячах бункеров слышат это. Мир, который выйдет наверх, будет помнить, кто начал войну.'},
  city:   {title:'ПОДЗЕМНЫЙ ГОРОД', text:'Тридцать дней. Бункер гудит, как улей: грядки, мастерская, дети учат буквы при свете ламп. Это уже не убежище — это город. Твой город.'},
  endure: {title:'ДОЛГАЯ НОЧЬ', text:'Вы пережили тридцать дней. Без радости, без надежды — но живые. Наверху всё ещё пепел. Внизу — всё ещё вы.'},
};

/* =========================================================
   3. СОСТОЯНИЕ ИГРЫ
   ========================================================= */
let S = null;
const rnd = arr => arr[Math.floor(Math.random()*arr.length)];
const chance = p => Math.random() < p;

function makePerson(name, prof, trait){
  return {name, prof, trait: trait || rnd(prof==='child' ? CHILD_TRAITS : ADULT_TRAITS), hp:100, sick:false, isolated:false, job:null};
}
function newState(){
  const s = {
    screen:'pick', day:1,
    res:{food:15, water:15, materials:6, morale:55, rad:10, signal:0},
    residents:[ makePerson('Ты','boss','leader'), makePerson('Пётр','electric'), makePerson('Вера','medic') ],
    rooms:{
      generator:{lvl:1,w:0}, water:{lvl:1,w:0}, filter:{lvl:1,w:0},
      farm:{lvl:0,w:0}, workshop:{lvl:0,w:0}, medbay:{lvl:0,w:0}, radio:{lvl:0,w:0},
    },
    flags:{}, seen:[], picked:[], eventId:null, ctx:{}, resultText:'', log:[], lastEvent:null, ending:null, journal:[], tab:'bunker',
  };
  // стартовая расстановка
  s.residents[0].job='filter'; s.residents[1].job='generator'; s.residents[2].job='water';
  return s;
}
// перевод старых сохранений (жители были просто именами)
function migrate(s){
  if(s.residents && typeof s.residents[0]==='string'){
    const PR={'Ты':'boss','Пётр':'electric','Вера':'medic','Марина':'farmer','Лёша':'child','Соня':'child','Глеб':'mechanic'};
    s.residents = s.residents.map(n=>makePerson(n, PR[n]||'plumber', n==='Ты'?'leader':undefined));
    for(const id in s.rooms) s.rooms[id].w=0;
  }
  return s;
}

/* ---------- помощники по людям ---------- */
const P = name => S.residents.find(p=>p.name===name);
const people = f => S.residents.filter(f || (()=>true));
const cap = id => S.rooms[id].lvl*2;
const assigned = id => people(p=>p.job===id);
const traitKnown = p => !TRAITS[p.trait].hidden || !!S.flags['known_'+p.name];
const canWalk = p => p.prof!=='child' && !p.sick && p.hp>=40;
function addResident(name, prof, trait){ if(!P(name)) S.residents.push(makePerson(name, prof, trait)); }
function killResident(name){
  const others = people(p=>p.name!=='Ты');
  const v = (name && P(name)) ? P(name) : (others.length ? rnd(others) : P('Ты'));
  if(!v) return 'Кто-то';
  S.residents.splice(S.residents.indexOf(v),1);
  return v.name;
}
function hurt(p, n){ p.hp = Math.max(0, p.hp - (p.trait==='tough' ? Math.ceil(n/2) : n)); }
function syncW(){
  for(const id in S.rooms){
    const a=assigned(id);
    if(a.length>cap(id)) a.slice(cap(id)).forEach(p=>p.job=null);
    S.rooms[id].w = assigned(id).filter(p=>!p.sick).length;
  }
  people(p=>p.sick && p.job).forEach(p=>p.job=null);
}
function workers(){ return people(p=>p.job).length; }
function freeWorkers(){ return people(p=>!p.job && !p.sick).length; }
// сила работника в отсеке
function mult(p, id){
  if(p.sick) return 0;
  let m=1;
  if(PROFS[p.prof].room===id) m*=1.5;
  if(p.prof==='child') m*=0.5;
  if(p.trait==='worker') m*=1.25;
  if(p.trait==='lazy') m*=0.75;
  if(p.hp<40) m*=0.5;
  return m;
}
function clamp(){
  const r=S.res;
  r.morale = Math.max(0, Math.min(100, r.morale));
  r.rad    = Math.max(0, Math.min(100, r.rad));
  ['food','water','materials','signal'].forEach(k=> r[k]=Math.max(0, r[k]));
  S.residents.forEach(p=> p.hp=Math.max(0, Math.min(100, Math.round(p.hp))));
}

/* =========================================================
   4. СОБЫТИЯ
   cond  — когда событие может выпасть
   once  — выпадает только один раз
   pre   — подготовка (выбор участников)
   choices — массив или функция, возвращающая массив
   choices[].req — условие, при котором кнопку можно нажать
   choices[].go  — что произойдёт; возвращает текст результата
   ========================================================= */
function choicesOf(e){ return typeof e.choices==='function' ? e.choices() : e.choices; }
function who(p){ return `${p.name} ${PROFS[p.prof].i}`; }

function sortieGo(name){
  const p=P(name); if(!p) return 'Никто не пошёл.';
  if(p.trait==='coward' && chance(.5)){ S.flags['known_'+p.name]=1; S.res.morale-=2; return `${p.name} дошёл до лестницы и повернул назад: «Я не могу… простите». Теперь все знают, что ${p.name} — трус.`; }
  hurt(p, 8+Math.floor(Math.random()*18));
  const roll=Math.random();
  if(roll < (p.trait==='tough'?0.06:0.12)){ killResident(p.name); S.res.morale-=10; return `${p.name} не вернулся. Только треск в рации — и тишина.`; }
  let bonus='';
  if(p.prof==='mechanic'){ S.res.materials+=4; bonus=' Как механик, ' + p.name + ' притащил ещё и годные запчасти.'; }
  if(p.prof==='medic'){ people(q=>q.sick).forEach(q=>q.sick=false); bonus=' В аптеке нашлись лекарства — все больные поправляются.'; }
  if(!S.flags.docs && roll<0.5){ S.flags.docs=1; S.res.materials+=4; return `${p.name} возвращается облучённым, но с добычей — и с промокшей папкой с грифом «ПОЛДЕНЬ. Совершенно секретно».${bonus}`; }
  S.res.materials+=7; S.res.food+=5;
  return `${p.name} возвращается с полным рюкзаком: консервы, провода, инструменты. Здоровье: ❤ ${p.hp}.${bonus}`;
}

      {t:'Дать всем отдохнуть', go:()=>{ people().forEach(p=>p.hp=Math.min(100,p.hp+10)); S.res.morale+=2; return 'Все отсыпаются. +10 ❤ каждому.'; }},
    ]
  },
  final:{
    title:'«Заря» на связи',
    text:()=>'Сигнал чистый. «Заря» передаёт координаты: сорок километров на север. Путь опасен, но там есть вода, свет и люди.',
    choices:[
      {t:'Вести всех на поверхность', go:()=>{ S.ending='surface'; return ''; }},
      {t:'Передать в эфир правду о «Полдне»', req:()=>S.flags.secret===1, go:()=>{ S.ending='secret'; return ''; }},
      {t:'Остаться в бункере', go:()=>{ S.flags.finalDeclined=1; return 'Ты благодаришь «Зарю» и выключаешь передатчик. Ваш дом — здесь.'; }},
    ]
  },
};
function ideaPerson(){
  const c=people(p=>['electric','medic','farmer','mechanic','plumber'].includes(p.prof) && !p.sick && !S.flags['idea_'+p.name]);
  return c.length ? c[0] : null;
}

function pickEvent(){
  if(S.day===1) return 'knock';
  if(S.flags.thiefCaught && !S.flags.thiefDone && P(S.flags.thiefCaught)) return 'thief_judge';
  if(S.flags.signal && !S.flags.finalDeclined && S.res.signal>=10) return 'final';
  const pool = Object.keys(EVENTS).filter(id=>{
    const e=EVENTS[id];
    if(['knock','final','quiet','thief_judge'].includes(id)) return false;
    if(e.once && S.seen.includes(id)) return false;
    if(id===S.lastEvent) return false;
    return !e.cond || e.cond();
  });
  if(pool.includes('pantry')) return 'pantry';
  if(!pool.length || chance(.12)) return 'quiet';
  return rnd(pool);
}

/* =========================================================
   5. РАСЧЁТ ДНЯ
   ========================================================= */
function compute(){
  syncW();
  const power = id => assigned(id).reduce((s,p)=>s+mult(p,id),0);
  let prodE=0, useE=0;
  for(const id in S.rooms){
    const r=S.rooms[id]; if(!r.lvl) continue;
    if(id==='generator') prodE += Math.round(r.lvl*4 + power(id)*ROOMS.generator.per);
    else useE += ROOMS[id].use;
  }
  const eff = useE ? Math.min(1, prodE/useE) : 1;
  const d={food:0, water:0, materials:0, morale:0, signal:0, rad:0, heal:0};
  const out={};
  for(const id in S.rooms){
    const r=S.rooms[id]; if(!r.lvl || id==='generator') continue;
    let v = power(id) * ROOMS[id].per * (1 + 0.5*(r.lvl-1));
    if(id==='filter') v += r.lvl*2;
    v = Math.round(v*eff);
    out[id]=v;
    if(id==='filter') d.rad -= v; else d[ROOMS[id].res] += v;
  }
  d.food  -= people().reduce((s,p)=>s+(p.trait==='glutton'?2:1),0);
  d.water -= S.residents.length;
  d.rad   += 5;                                                    // радиация просачивается с поверхности
  d.morale += people(p=>p.trait==='leader' && !p.sick && p.hp>=40).length;   // лидеры
  if(S.residents.length>5 && !S.rooms.medbay.lvl) d.morale -= 1;  // теснота без медпункта
  return {d, prodE, useE, eff, out};
}

function endDay(){
  const {d, eff} = compute();
  const r=S.res, log=[];
  const sign = v => (v>=0?'+':'')+v;
  log.push(`🍞 Еда ${sign(d.food)}   💧 Вода ${sign(d.water)}   🛠 ${sign(d.materials)}`);
  if(eff<1) log.push(`<span class="warn">⚡ Не хватает энергии — отсеки работали на ${Math.round(eff*100)}%</span>`);
  for(const k in d) if(k!=='heal') r[k]+=d[k];

  // Вор тайком таскает еду
  people(p=>p.trait==='thief').forEach(()=>{ if(chance(.4) && r.food>0){ r.food-=2; S.flags.stolen=(S.flags.stolen||0)+2; } });
  if((S.flags.stolen||0)>=4) log.push('<span class="warn">🦝 Запасов меньше, чем должно быть…</span>');

  // Голод
  const hungry = r.food<0 || r.water<0;
  if(hungry){
    r.food=Math.max(0,r.food); r.water=Math.max(0,r.water); r.morale-=8;
    people().forEach(p=>hurt(p,15));
    log.push('<span class="bad">Еды или воды не хватило. Все теряют по 15 ❤.</span>');
  }
  // Радиация бьёт по здоровью
  if(r.rad>=50){
    const dmg=Math.round((r.rad-40)/6);
    people().forEach(p=>hurt(p,dmg));
    log.push(`<span class="warn">☢ Радиация ${r.rad}: все теряют до ${dmg} ❤.</span>`);
    if(r.rad>=60) r.morale-=4;
  }
  // Болезни: урон, заражение, выздоровление
  people(p=>p.sick).forEach(p=>{
    hurt(p,10);
    if(!p.isolated && chance(.12)){
      const t=rnd(people(q=>!q.sick && q!==p && (q.trait==='sickly' || chance(.6))));
      if(t){ t.sick=true; log.push(`<span class="bad">🤒 ${p.name} заразил(а) ${t.name}.</span>`); }
    }
    if(chance(p.trait==='sickly'?0.12:0.25)){ p.sick=false; p.isolated=false; log.push(`<span class="good">${p.name} поправился сам.</span>`); }
  });
  // Медпункт лечит
  let H=d.heal;
  if(H>0){
    const medicIn = assigned('medbay').some(p=>p.prof==='medic');
    people().sort((a,b)=>(b.sick-a.sick)||(a.hp-b.hp)).forEach(p=>{
      if(H<=0) return;
      if(p.sick && chance(medicIn?0.75:0.4)){ p.sick=false; p.isolated=false; H-=8; log.push(`<span class="good">➕ ${p.name} вылечен(а) в медпункте.</span>`); }
      const need=100-p.hp, give=Math.min(need,H); p.hp+=give; H-=give;
    });
  }
  // Отдых: здоровые восстанавливаются сами
  if(!hungry && r.rad<35) people(p=>!p.sick).forEach(p=>p.hp+=4);

  clamp();
  // Смерти
  people(p=>p.hp<=0).forEach(p=>{
    killResident(p.name); r.morale-=7;
    log.push(`<span class="bad">☠ ${p.name} умер(ла). Мораль −7.</span>`);
  });
  people(p=>p.hp>0 && p.hp<30).forEach(p=>log.push(`<span class="warn">${p.name} очень слаб(а): ❤ ${p.hp}.</span>`));
  clamp();
  S.log=log;
  S.day++;
  checkEnding();
}

function checkEnding(){
  if(S.ending) return;
  if(S.residents.length===0) S.ending='silence';
  else if(S.res.morale<=0) S.ending='mutiny';
  else if(S.day>30) S.ending = (S.residents.length>=6 && S.res.morale>=40) ? 'city' : 'endure';
}

/* =========================================================
   6. ДЕЙСТВИЯ ИГРОКА
   ========================================================= */
function go(screen){ S.screen=screen; save(); render(); window.scrollTo(0,0); }

function togglePick(id){
  haptic();
  const i=S.picked.indexOf(id);
  if(i>=0) S.picked.splice(i,1); else if(S.picked.length<3) S.picked.push(id);
  render();
}
function descend(){
  haptic('medium');
  S.picked.forEach(id=>{
    if(id==='food') S.res.food+=15;
    if(id==='water') S.res.water+=15;
    if(id==='tools') S.res.materials+=10;
    if(id==='meds'){ S.res.morale+=15; S.flags.medkit=1; }
    if(id==='radio') S.rooms.radio.lvl=1;
    if(id==='filter') S.rooms.filter.lvl=2;
  });
  bgm.stop();
  playIntro(startMorning);
}
function startMorning(){
  bgm.play();
  S.eventId = pickEvent();
  S.ctx = {};
  const e=EVENTS[S.eventId];
  if(e.pre) e.pre();
  go('event');
}
function choose(i){
  haptic('medium');
  const e=EVENTS[S.eventId], c=choicesOf(e)[i];
  if(!c) return;
  if(S.eventId==='idea') S.flags['idea_'+S.ctx.name]=1;
  if(c.req && !c.req()) return;
  S.resultText = c.go();
  S.journal = S.journal || [];
  S.journal.push({d:S.day, t:e.title, c:c.t, r:S.resultText});
  if(S.journal.length>40) S.journal.shift();
  if(e.once || S.eventId==='knock') S.seen.push(S.eventId);
  S.lastEvent = S.eventId;
  clamp(); checkEnding();
  if(S.ending) return go('ending');
  go('result');
}
function setJob(name, id){
  const p=P(name); if(!p || p.sick) return;
  id = id || null;
  if(id && p.job!==id && assigned(id).length>=cap(id)) return;
  haptic(); p.job=id; save(); render();
}
function upgrade(id){
  const r=S.rooms[id];
  const cost = r.lvl===0 ? ROOMS[id].cost : r.lvl*8;
  if(r.lvl>=MAX_LVL || S.res.materials<cost) return;
  haptic('heavy'); S.res.materials-=cost; r.lvl++; save(); render();
}
function finishDay(){ haptic('medium'); endDay(); go(S.ending ? 'ending' : 'summary'); }
function restart(){ wipe(); S=newState(); S.screen='pick'; go('pick'); }

  out.push(`<path d="M120 60 q4 8 -2 16 q-3 6 2 12 M260 60 q-3 6 2 12 q4 6 0 12" stroke="#3a2a1a" stroke-width="1" fill="none"/>`);
  // оголовок: люк, вентиляция, мешки
  out.push(`<rect x="4" y="38" width="44" height="22" fill="#5a5c52"/><rect x="2" y="35" width="48" height="4" fill="#6c6e62"/>
    <rect x="16" y="43" width="18" height="17" fill="#3a3c34"/><rect x="17.5" y="44.5" width="15" height="15.5" fill="#4d5046"/><circle cx="25" cy="52" r="3.4" fill="none" stroke="#2a2c25" stroke-width="1.2"/>
    <rect x="38" y="22" width="5" height="14" fill="#4d5046"/><rect x="36" y="20" width="9" height="3" fill="#3a3c34"/>
    <path d="M9 41 l3.6 6 h-7.2z" fill="#e8c23a"/>
    ${[0,1,2,3].map(i=>`<ellipse cx="${55+i*7}" cy="56" rx="4" ry="2.6" fill="#6a5236"/>`).join('')}${[0,1,2].map(i=>`<ellipse cx="${58.5+i*7}" cy="51.5" rx="4" ry="2.6" fill="#7a6040"/>`).join('')}`);
  // бетонная оболочка
  out.push(`<rect x="44" y="66" width="354" height="226" rx="3" fill="#3b3c35"/><rect x="47" y="69" width="348" height="220" fill="#202119"/>`);
  // шахта
  out.push(`<rect x="12" y="60" width="28" height="226" fill="#3b3c35"/><rect x="15" y="60" width="22" height="226" fill="#0f0e0b"/>`);
  for(let y=64;y<284;y+=7) out.push(`<line x1="18" y1="${y}" x2="34" y2="${y}" stroke="#4b4f45" stroke-width="1.3"/>`);

  [118,222].forEach(y=>out.push(`<rect x="37" y="${y-34}" width="13" height="${34}" fill="#2a2b24"/><rect x="37" y="${y}" width="13" height="2" fill="#4b4f45"/><circle cx="26" cy="${y-30}" r="1.6" fill="#ffd27a" opacity=".8"/>`));

  let delay=0;
  for(const id in ROOMPOS){
    const [c,row]=ROOMPOS[id], x=50+c*86, y=74+row*104;
    const isLiving=id==='living', r=isLiving?{lvl:1}:S.rooms[id];

      if(crew.length>6) g+=`<text x="80" y="20" font-size="7" fill="#d8e0c8" text-anchor="end">+${crew.length-6}</text>`;

    if(!isLiving && r.lvl) for(let i=0;i<MAX_LVL;i++) g+=`<rect x="${RW-4-(MAX_LVL-1-i)*4.6}" y="${RH-7}" width="3.4" height="3.4" rx=".6" fill="${i<r.lvl?'#ff8a3d':'#3a3a32'}"/>`;
    g+=`</g></g>`;
    out.push(g);
  }
  // стены между отсеками
  [134,220,306].forEach(x=>{ out.push(`<rect x="${x}" y="74" width="2" height="96" fill="#3b3c35"/><rect x="${x}" y="178" width="2" height="96" fill="#3b3c35"/>`); });
  out.push(`<rect x="47" y="274" width="348" height="8" fill="#45463e"/>`);

  if(S.res.rad>=35) out.push(`<rect x="47" y="69" width="348" height="220" fill="url(#radg)" opacity="${Math.min(1,(S.res.rad-30)/50).toFixed(2)}" pointer-events="none"/>`);

function focusRoom(id){
  haptic();
  if(S.tab!=='people' && S.rooms[id].lvl>0){ S.tab='people'; render(); }
  else if(S.rooms[id].lvl===0){ S.tab='build'; render(); id='b-'+id; }
  const el=document.getElementById('room-'+id); if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'), 1400);
}

/* =========================================================
   7.2 ФОНОВАЯ МУЗЫКА: тёмный эмбиент (синтезируется в браузере)
   ========================================================= */
const bgm = (()=>{
  let AC=null, master=null, revIn=null, stopFn=null, playing=false;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(AC){ if(AC.state==='suspended' && !document.hidden) AC.resume(); return; }
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
      const conv=AC.createConvolver(), len=AC.sampleRate*3.5, b=AC.createBuffer(2,len,AC.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
      conv.buffer=b; revIn=AC.createGain(); const rg=AC.createGain(); rg.gain.value=0.6; revIn.connect(conv).connect(rg).connect(master);
    }catch(e){ AC=null; }
  }
  function note(f,t,o){
    const os=AC.createOscillator(); os.type=o.type||'sine'; os.frequency.value=f;
    const fl=AC.createBiquadFilter(); fl.frequency.value=o.cut||8000;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(o.g,t+o.a); g.gain.exponentialRampToValueAtTime(0.0001,t+o.a+o.r);
    os.connect(fl).connect(g); g.connect(master); if(o.rev){ const s=AC.createGain(); s.gain.value=o.rev; g.connect(s).connect(revIn); }
    os.start(t); os.stop(t+o.a+o.r+0.05);
  }
  function start(){
    const nodes=[];
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.connect(master);
    const lfo=AC.createOscillator(), lg=AC.createGain(); lfo.frequency.value=0.05; lg.gain.value=220; lfo.connect(lg).connect(lp.frequency); lfo.start(); nodes.push(lfo);
    [[33,0],[33,7],[40,-5],[45,4]].forEach(([m,d])=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=d; const g=AC.createGain(); g.gain.value=0.05; o.connect(g).connect(lp); o.start(); nodes.push(o); });
    const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const click=t=>{ const n=AC.createBufferSource(); n.buffer=nb; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=4000; f.Q.value=3; const g=AC.createGain(); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.012); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t+0.03); };
    const chords=[[57,60,64,71],[53,57,60,67],[55,59,62,69],[52,55,59,64]];
    let next=AC.currentTime+0.1, i=0;
    const id=setInterval(()=>{
      while(next<AC.currentTime+0.3){
        const t=next;
        if(i%16===0) chords[(i/16)%4].forEach((m,k)=>note(mtof(m),t+k*0.15,{type:'triangle',a:2.5,r:5,g:0.035,cut:1400,rev:0.8}));
        if(Math.random()<0.07) note(mtof(84+Math.floor(Math.random()*8)),t,{a:0.005,r:3,g:0.03,rev:1.2});
        if(Math.random()<0.3){ const n=1+Math.floor(Math.random()*3); for(let k=0;k<n;k++) click(t+Math.random()*0.5); }
        next+=0.5; i++;
      }
    },50);
    return ()=>{ clearInterval(id); nodes.forEach(o=>{ try{o.stop()}catch(e){} }); lp.disconnect(); };
  }
  return {
    ensure,
    play(){ ensure(); if(!AC || playing || !musicOn()) return; playing=true; stopFn=start(); master.gain.cancelScheduledValues(AC.currentTime); master.gain.setTargetAtTime(0.5,AC.currentTime,1.2); },
    stop(){ if(!AC || !playing) return; playing=false; master.gain.setTargetAtTime(0,AC.currentTime,0.4); const f=stopFn; stopFn=null; setTimeout(()=>f&&f(),1500); },
    isPlaying:()=>playing,
    suspend(){ if(AC && AC.state==='running') AC.suspend(); },
  };
})();

  if(on) bgm.play(); else bgm.stop();

}

/* =========================================================
   7.5 ЗАСТАВКА: бег в бункер (canvas + звук)
   Сцена рисуется в «сценических» координатах 360×640 и
   масштабируется под любой экран.
   ========================================================= */
const INTRO_LEN = 17.2;
const iCl  = v => Math.max(0, Math.min(1, v));
const iEase= k => k*k*(3-2*k);
const iSm  = (a,b,t) => iEase(iCl((t-a)/(b-a)));
const iPulse=(t,a,d) => t>=a ? Math.max(0, 1-(t-a)/d) : 0;
function iHex(h){ const n=parseInt(h.slice(1),16); return [n>>16,(n>>8)&255,n&255]; }
function iMix(a,b,k){ const A=iHex(a),B=iHex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`; }
function iRand(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

let IDATA=null;
function introData(){
  if(IDATA) return IDATA;
  const r=iRand(7);
  const layer=(x0,x1,minW,maxW,minH,maxH,winP)=>{
    const a=[]; let x=x0;
    while(x<x1){
      const w=minW+r()*(maxW-minW), h=minH+r()*(maxH-minH), win=[];
      if(winP) for(let wy=10; wy<h-10; wy+=12) for(let wx=5; wx<w-7; wx+=9)
        if(r()<winP) win.push({x:wx, y:wy, off:1+r()*7, c:r()<.8?'#e8c070':'#a8c4e0', f:r()<.08});
      a.push({x,w,h,win,ant:r()<.25,tank:r()<.2}); x+=w+r()*5;
    }
    return a;
  };
  IDATA={
    far:  layer(-800,1300,18,42,110,230,0.22),
    mid:  layer(-800,1300,28,58,70,170,0.32),
    near: layer(-800,1300,40,80,40,100,0.12),
    clouds: Array.from({length:8},()=>({x:-300+r()*900, y:40+r()*170, w:90+r()*150, h:14+r()*18, s:3+r()*6})),
    stars: Array.from({length:40},()=>({x:-200+r()*760, y:r()*300, b:r()})),
    debris: Array.from({length:22},()=>({x:r(), y:r(), s:2+r()*5, rot:r()*6, vr:(r()-.5)*14})),
    edge: Array.from({length:16},()=>({y:r(), rr:24+r()*40, o:r()*30})),
    dust: Array.from({length:50},()=>({x:r()*360, y:r()*640, s:.6+r()*1.6, v:10+r()*24, ph:r()*6})),
  };
  return IDATA;
}

/* ---------- бегущий человек: детальный силуэт ---------- */
// kind: 0 — Ты (рюкзак), 1 — Пётр (кепка, ящик), 2 — Вера (пучок, сумка)
function iFigure(c, x, y, h, ph, kind, fill){
  c.save(); c.translate(x,y); const s=h/100; c.scale(s,s);
  c.fillStyle=fill; c.strokeStyle=fill; c.lineCap='round'; c.lineJoin='round';
  c.translate(0, -Math.abs(Math.cos(ph))*3);
  const hip=[0,-48], sh=[8,-80];
  const leg=(a)=>{
    const th=Math.sin(ph+a)*0.75, kn=Math.max(0,Math.cos(ph+a+0.6))*1.25+0.15;
    const k=[hip[0]+Math.sin(th)*25, hip[1]+Math.cos(th)*25], sa=th-kn;
    const f=[k[0]+Math.sin(sa)*24, k[1]+Math.cos(sa)*24];
    c.lineWidth=11; c.beginPath(); c.moveTo(hip[0],hip[1]); c.lineTo(k[0],k[1]); c.stroke();
    c.lineWidth=9;  c.beginPath(); c.moveTo(k[0],k[1]); c.lineTo(f[0],f[1]); c.stroke();
    c.lineWidth=6;  c.beginPath(); c.moveTo(f[0]-2,f[1]); c.lineTo(f[0]+9,f[1]+1); c.stroke();
  };
  const arm=(a)=>{
    const ua=-Math.sin(ph+a)*0.9, el=[sh[0]+Math.sin(ua)*18, sh[1]+Math.cos(ua)*18], fa=ua+1.3;
    const hd=[el[0]+Math.sin(fa)*16, el[1]+Math.cos(fa)*16];
    c.lineWidth=8; c.beginPath(); c.moveTo(sh[0],sh[1]); c.lineTo(el[0],el[1]); c.stroke();
    c.lineWidth=7; c.beginPath(); c.moveTo(el[0],el[1]); c.lineTo(hd[0],hd[1]); c.stroke();
    return hd;
  };
  leg(Math.PI); const farHand=arm(Math.PI);
  if(kind===1){ c.fillRect(farHand[0]-8, farHand[1]-2, 16, 10); }            // ящик с инструментами
  c.beginPath(); c.moveTo(-7,-44); c.lineTo(8,-44); c.lineTo(16,-82); c.lineTo(-1,-87); c.closePath(); c.fill(); // торс
  c.lineWidth=7; c.beginPath(); c.moveTo(9,-84); c.lineTo(13,-90); c.stroke();  // шея
  c.beginPath(); c.arc(15,-97,9,0,7); c.fill();                                // голова
  if(kind===0){ c.fillRect(-14,-86,14,28); c.fillRect(-12,-60,10,4); }          // рюкзак
  if(kind===1){ c.fillRect(7,-108,18,5); c.fillRect(20,-105,8,3); }             // кепка
  if(kind===2){ c.beginPath(); c.arc(7,-103,5.5,0,7); c.fill(); c.fillRect(-6,-62,12,13); } // пучок и сумка
  leg(0); arm(0);
  c.restore();
}
// Силуэт + контур света (rim) со стороны источника
function iRunner(c,x,y,h,ph,kind,rimCol,rx,ry){
  if(rimCol){ iFigure(c,x+rx,y+ry,h,ph,kind,rimCol); }
  iFigure(c,x,y,h,ph,kind,'#050505');
}
// Тень на земле: силуэт «положенный» на пол
function iShadow(c,x,y,h,ph,kind,skew,squash,alpha){
  c.save(); c.translate(x,y); c.transform(1,0,-skew,-squash,0,0);
  iFigure(c,0,0,h,ph,kind,`rgba(0,0,0,${alpha})`);
  c.restore();
  c.fillStyle=`rgba(0,0,0,${alpha*0.9})`; c.beginPath(); c.ellipse(x+4,y,h*0.17,h*0.035,0,0,7); c.fill();
}

/* ---------- окружение ---------- */
function iSky(c,E,top,bot,y1){
  const g=c.createLinearGradient(0,0,0,y1); g.addColorStop(0,top); g.addColorStop(1,bot);
  c.fillStyle=g; c.fillRect(-E,-500,360+E*2,y1+500);
}
function iCity(c,arr,base,color,t,windows,blink){
  for(const b of arr){
    c.fillStyle=color; c.fillRect(b.x, base-b.h, b.w, b.h+1);
    if(b.tank){ c.fillRect(b.x+b.w*0.3, base-b.h-9, 9, 9); c.fillRect(b.x+b.w*0.3+1, base-b.h-14, 7, 5); }
    if(b.ant){
      c.fillRect(b.x+b.w*0.5, base-b.h-16, 1.5, 16);
      if(blink && Math.sin(t*4+b.x)>0){ c.fillStyle='#ff3b2a'; c.beginPath(); c.arc(b.x+b.w*0.5+0.7, base-b.h-17, 1.6, 0, 7); c.fill(); }
    }
    if(windows) for(const w of b.win){
      if(t>=w.off) continue;
      let a=1; if(w.f) a = Math.sin(t*13+b.x+w.y)>0 ? 1 : 0.35;
      c.globalAlpha=a*0.9; c.fillStyle=w.c; c.fillRect(b.x+w.x, base-b.h+w.y, 4, 5); c.globalAlpha=1;
    }
  }
}
function iBeam(c,x,y,ang,len,wd,a){
  c.save(); c.translate(x,y); c.rotate(ang);
  const g=c.createLinearGradient(0,0,0,-len); g.addColorStop(0,`rgba(205,215,255,${a})`); g.addColorStop(1,'rgba(205,215,255,0)');
  c.fillStyle=g; c.beginPath(); c.moveTo(-3,0); c.lineTo(3,0); c.lineTo(wd,-len); c.lineTo(-wd,-len); c.closePath(); c.fill();
  c.restore();
}
function iMushroom(c,x,base,a,s){
  if(a<0) return;
  const k=iEase(iCl(a/6)), top=base-(130+250*k)*s, cw=(46+118*k)*s;
  const gg=c.createRadialGradient(x,top+cw*0.2,5,x,top+cw*0.2,cw*2.4);
  gg.addColorStop(0,'rgba(255,175,90,.55)'); gg.addColorStop(1,'rgba(255,120,40,0)');
  c.fillStyle=gg; c.fillRect(x-cw*2.6,top-cw*2.2,cw*5.2,cw*5.4);
  const sg=c.createLinearGradient(x-cw*0.3,0,x+cw*0.3,0);
  sg.addColorStop(0,'#4a1c0c'); sg.addColorStop(.5,'#ffb860'); sg.addColorStop(1,'#4a1c0c');
  c.fillStyle=sg; c.beginPath();
  c.moveTo(x-cw*0.34,base); c.quadraticCurveTo(x-cw*0.1,(base+top)/2,x-cw*0.17,top+cw*0.22);
  c.lineTo(x+cw*0.17,top+cw*0.22); c.quadraticCurveTo(x+cw*0.1,(base+top)/2,x+cw*0.34,base); c.closePath(); c.fill();
  c.strokeStyle='rgba(255,215,175,.35)'; c.lineWidth=4*s; c.beginPath(); c.ellipse(x,(base+top)/2+12*s,cw*0.6,cw*0.1,0,0,7); c.stroke();
  for(let i=0;i<14;i++){
    const ang=i/14*Math.PI*2+a*0.12, rr=cw*(0.55+0.1*Math.sin(i*3.1));
    const px=x+Math.cos(ang)*rr*0.82, py=top+Math.sin(ang)*rr*0.34;
    const g=c.createRadialGradient(px,py-cw*0.12,2,px,py,cw*0.42);
    g.addColorStop(0,'#ffe2a0'); g.addColorStop(.45,'#ff8a32'); g.addColorStop(1,'rgba(80,28,14,.95)');
    c.fillStyle=g; c.beginPath(); c.arc(px,py,cw*0.36,0,7); c.fill();
  }
  const cg=c.createRadialGradient(x,top,2,x,top,cw*0.55); cg.addColorStop(0,'#fff8d8'); cg.addColorStop(1,'rgba(255,170,60,0)');
  c.fillStyle=cg; c.beginPath(); c.arc(x,top,cw*0.55,0,7); c.fill();
  c.fillStyle='rgba(40,22,16,.5)'; c.beginPath(); c.ellipse(x,top-cw*0.3,cw*0.72,cw*0.2,0,0,7); c.fill();
}

/* ---------- Кадр 1: город, тревога ---------- */
function iShotCity(c,t,D,E){
  const z=1+t*0.03; c.save(); c.translate(180,420); c.scale(z,z); c.translate(-180,-420);
  iSky(c,E*1.2,'#03050b','#2a1622',470);
  for(const s of D.stars){ c.fillStyle=`rgba(220,220,255,${0.2+0.5*s.b*(0.6+0.4*Math.sin(t*3+s.x))})`; c.fillRect(s.x,s.y,1.2,1.2); }
  c.save(); c.shadowColor='rgba(225,215,185,.7)'; c.shadowBlur=34; c.fillStyle='#ddd6bc';
  c.beginPath(); c.arc(278,120,20,0,7); c.fill(); c.restore();
  c.fillStyle='rgba(0,0,0,.08)'; c.beginPath(); c.arc(272,115,5,0,7); c.arc(285,126,3,0,7); c.fill();
  for(const cl of D.clouds){
    const x=cl.x+t*cl.s;
    c.fillStyle='rgba(18,14,24,.88)'; c.beginPath(); c.ellipse(x,cl.y,cl.w/2,cl.h/2,0,0,7); c.fill();
    c.fillStyle='rgba(150,120,140,.12)'; c.beginPath(); c.ellipse(x,cl.y-cl.h*0.32,cl.w*0.42,cl.h*0.18,0,0,7); c.fill();
  }
  [[50,0],[205,2.1],[330,4.2]].forEach(([bx,p],i)=> iBeam(c,bx,470,Math.sin(t*0.9+p)*0.45+(i-1)*0.18,600,28,0.14));
  c.fillStyle=`rgba(190,30,25,${0.07+0.09*(0.5+0.5*Math.sin(t*5))})`; c.fillRect(-E*1.2,-500,360+E*2.4,970);
  iCity(c,D.far,470,'#12131b',t,true,true);
  iCity(c,D.mid,470,'#0b0c11',t,true,true);
  iCity(c,D.near,470,'#060609',t,true,false);
  c.fillStyle='#07080a'; c.fillRect(-E*1.2,470,360+E*2.4,700);
  for(let x=-E; x<360+E; x+=26){ c.fillStyle='rgba(232,192,112,.25)'; c.fillRect(x,478,10,1.5); } // огни дороги
  c.restore();
  // громкоговоритель на переднем плане
  c.fillStyle='#020203'; c.fillRect(34,300,7,400); c.fillRect(22,300,31,5);
  c.beginPath(); c.moveTo(24,296); c.lineTo(4,284); c.lineTo(4,318); c.lineTo(24,308); c.fill();
  c.beginPath(); c.moveTo(51,296); c.lineTo(71,284); c.lineTo(71,318); c.lineTo(51,308); c.fill();
  for(let k=0;k<3;k++){
    const rr=((t*55+k*26)%78)+8;
    c.strokeStyle=`rgba(255,90,70,${(1-rr/86)*0.55})`; c.lineWidth=2;
    c.beginPath(); c.arc(72,301,rr,-0.6,0.6); c.stroke();
  }
}

/* ---------- Кадр 2: бег по улице, вспышка ---------- */
function iShotStreet(c,t,D,E){
  const u=t-3.4, post=t>=7.4, pk=iSm(7.4,8.0,t);
  const lead=60+u*70, cam=lead-215;
  iSky(c,E,iMix('#04060c','#2a1208',pk),iMix('#2b1824','#c0581c',pk),470);
  if(!post){ for(const s of D.stars) if(s.y<250){ c.fillStyle=`rgba(220,220,255,${0.15+0.4*s.b})`; c.fillRect(s.x,s.y,1.2,1.2);} }
  if(post) iMushroom(c, 70-cam*0.03, 470, t-7.4, 1);
  c.save(); c.translate(-cam*0.1,0); iCity(c,D.far,470,post?'#1c0f08':'#11121a',t,!post,!post); c.restore();
  c.save(); c.translate(-cam*0.35,0); iCity(c,D.mid,470,post?'#140a06':'#0a0b10',t,!post,!post); c.restore();

  // гаражи (параллакс 0.8)
  c.save(); c.translate(-cam*0.8,0);
  for(let i=0;i<24;i++){
    const gx=-100+i*64;
    c.fillStyle=post?'#1d130d':'#131418'; c.fillRect(gx,420,60,50);
    c.fillStyle=post?'#2a1a10':'#1a1b20'; c.fillRect(gx-2,416,64,6);
    c.fillStyle='rgba(0,0,0,.35)'; c.fillRect(gx,422,60,4);
    c.strokeStyle='rgba(255,255,255,.05)'; c.lineWidth=1;
    for(let l=0;l<6;l++){ c.beginPath(); c.moveTo(gx+8,432+l*6); c.lineTo(gx+52,432+l*6); c.stroke(); }
    if(post){ c.fillStyle='rgba(255,140,60,.18)'; c.fillRect(gx,420,3,50); }
  }
  c.restore();

  // тротуар и дорога
  c.fillStyle=post?'#2a1d14':'#1b1c1f'; c.fillRect(-E,470,360+2*E,24);
  c.fillStyle=post?'#3a281a':'#2a2b2e'; c.fillRect(-E,492,360+2*E,3);
  c.fillStyle=post?'#170f0a':'#0e0f11'; c.fillRect(-E,495,360+2*E,300);
  c.fillStyle=post?'rgba(255,190,120,.35)':'rgba(200,200,190,.25)';
  for(let wx=Math.floor((cam-E)/70)*70; wx<cam+360+E; wx+=70) c.fillRect(wx-cam,575,34,3);
  if(post){ const g=c.createLinearGradient(-E,0,300,0); g.addColorStop(0,'rgba(255,140,60,.35)'); g.addColorStop(1,'rgba(255,140,60,0)'); c.fillStyle=g; c.fillRect(-E,470,360+2*E,330); }

  // фонари
  const lamps=[];
  for(let i=0;i<7;i++){
    const lx=40+i*190, sx=lx-cam; lamps.push(lx);
    const on = !post && Math.sin(t*29+i*7)>-0.92;
    if(on){
      const cg=c.createLinearGradient(0,338,0,500); cg.addColorStop(0,'rgba(240,200,120,.32)'); cg.addColorStop(1,'rgba(240,200,120,.03)');
      c.fillStyle=cg; c.beginPath(); c.moveTo(sx+18,340); c.lineTo(sx+30,340); c.lineTo(sx+76,500); c.lineTo(sx-28,500); c.closePath(); c.fill();
      c.fillStyle='rgba(240,200,120,.16)'; c.beginPath(); c.ellipse(sx+24,494,56,9,0,0,7); c.fill();
    }
    c.fillStyle='#0a0a0b'; c.fillRect(sx-2,330,5,165); c.fillRect(sx-2,330,30,4); c.fillRect(sx+16,333,16,6);
    if(on){ c.save(); c.shadowColor='#ffd890'; c.shadowBlur=14; c.fillStyle='#ffe6b0'; c.fillRect(sx+18,338,12,3); c.restore(); }
  }

  // брошенная машина
  const cx=470-cam;
  c.fillStyle='rgba(0,0,0,.45)'; c.beginPath(); c.ellipse(cx+48,546,62,7,0,0,7); c.fill();
  c.fillStyle='#16171b';
  c.beginPath(); c.moveTo(cx,540); c.lineTo(cx,518); c.lineTo(cx+20,514); c.lineTo(cx+34,498); c.lineTo(cx+70,498); c.lineTo(cx+86,514); c.lineTo(cx+100,518); c.lineTo(cx+100,540); c.closePath(); c.fill();
  c.fillStyle=post?'#ffb070':'#2c3440'; c.globalAlpha=post?0.35:0.8; c.fillRect(cx+37,502,14,12); c.fillRect(cx+54,502,14,12); c.globalAlpha=1;
  c.fillStyle='#0b0b0d'; c.fillRect(cx+18,512,4,26); c.beginPath(); c.moveTo(cx+20,514); c.lineTo(cx+4,500); c.lineTo(cx+2,526); c.closePath(); c.fill(); // открытая дверь
  c.fillStyle='#050505'; c.beginPath(); c.arc(cx+22,540,9,0,7); c.arc(cx+80,540,9,0,7); c.fill();
  if(!post && Math.sin(t*7)>0){ c.save(); c.shadowColor='#ffae2a'; c.shadowBlur=12; c.fillStyle='#ffae2a'; c.fillRect(cx+96,520,4,4); c.fillRect(cx,520,4,4); c.restore(); }

  // бегущие (сзади вперёд)
  const R=[0,1,2].map(i=>({i, x:lead-i*36+Math.sin(u*1.3+i)*4, y:512-i*8, h:76-i*4, ph:u*11+i*1.9}));
  for(const r of R.slice().reverse()){
    const sx=r.x-cam;
    for(let j=0;j<4;j++){ const ag=(u*3+j/4+r.i*.37)%1; c.fillStyle=`rgba(${post?'150,100,70':'120,115,110'},${(1-ag)*0.22})`; c.beginPath(); c.arc(sx-ag*22,r.y-2-ag*6,2+ag*6,0,7); c.fill(); }
    if(!post){
      let near=lamps[0]; for(const lx of lamps) if(Math.abs(lx+24-r.x)<Math.abs(near+24-r.x)) near=lx;
      const sk=Math.max(-1.6,Math.min(1.6,(r.x-(near+24))/70));
      iShadow(c,sx,r.y,r.h,r.ph,r.i,sk,0.3,0.4);
      iRunner(c,sx,r.y,r.h,r.ph,r.i,'rgba(240,200,120,.55)',(near+24-r.x)>0?1.3:-1.3,-0.8);
    } else {
      iShadow(c,sx,r.y,r.h,r.ph,r.i,2.6,0.16,0.62);
      iRunner(c,sx,r.y,r.h,r.ph,r.i,`rgba(255,${Math.round(220-60*pk)},140,.9)`,-1.8,-0.6);
    }
    if(r.i===0 && t<6.6){ c.fillStyle='#c9e265'; c.font='bold 11px Courier New'; c.textAlign='center'; c.fillText('▼ ТЫ', sx+10, r.y-r.h-22); }
  }
  // передний план: столбики
  for(let i=0;i<8;i++){ const fx=i*150-cam*1.35%150; c.fillStyle='#030303'; c.fillRect(fx,598,10,60); c.fillRect(fx-2,596,14,5); }
  if(post){ c.fillStyle=`rgba(255,120,40,${0.08*pk})`; c.fillRect(-E,-500,360+2*E,1300); }
}

/* ---------- Кадр 3: вход в бункер, ударная волна ---------- */
function iFacade(c,E,x0,x1){
  c.save(); c.beginPath(); c.rect(x0,0,x1-x0,640); c.clip();
  const fg=c.createLinearGradient(190,0,360,0); fg.addColorStop(0,'#8a6a50'); fg.addColorStop(.35,'#585a4f'); fg.addColorStop(1,'#3a3c35');
  c.fillStyle=fg; c.fillRect(190,362,170+E,120);
  c.strokeStyle='rgba(0,0,0,.25)'; c.lineWidth=1;
  for(let y=382;y<480;y+=24){ c.beginPath(); c.moveTo(190,y); c.lineTo(360+E,y); c.stroke(); }
  for(let x=200;x<360+E;x+=44){ c.beginPath(); c.moveTo(x,362); c.lineTo(x,480); c.stroke(); }
  c.fillStyle='#6c6e62'; c.fillRect(180,350,180+E,14);
  c.fillStyle='rgba(0,0,0,.4)'; c.fillRect(190,364,170+E,10);
  c.fillStyle='rgba(225,215,180,.75)'; c.font='bold 10px Courier New'; c.textAlign='center'; c.fillText('УБЕЖИЩЕ №7', 318, 392);
  c.fillStyle='#e8c23a'; c.beginPath(); c.moveTo(318,412); c.lineTo(332,436); c.lineTo(304,436); c.closePath(); c.fill();
  c.fillStyle='#111'; c.font='bold 13px sans-serif'; c.textAlign='center'; c.fillText('☢',318,433);
  // рама с жёлто-чёрными полосами
  c.save(); c.beginPath(); c.rect(208,390,68,90); c.rect(214,396,56,84); c.clip('evenodd');
  c.fillStyle='#e8c23a'; c.fillRect(208,390,68,90);
  c.fillStyle='#151515'; for(let k=-100;k<120;k+=14){ c.beginPath(); c.moveTo(208+k,390); c.lineTo(216+k,390); c.lineTo(216+k-90,480); c.lineTo(208+k-90,480); c.closePath(); c.fill(); }
  c.restore();
  c.restore();
}
function iShotBunker(c,t,D,E){
  const u=t-9.6;
  const z=1+u*0.025; c.save(); c.translate(240,450); c.scale(z,z); c.translate(-240,-450);
  iSky(c,E*1.2,'#2a1208','#b8561e',480);
  iMushroom(c,-20,480,t-7.4,0.8);
  c.save(); c.translate(0,12); iCity(c,D.far,480,'#1c0e07',99,false,false); c.restore();
  const gg=c.createLinearGradient(0,480,0,640); gg.addColorStop(0,'#3e2818'); gg.addColorStop(1,'#120a06');
  c.fillStyle=gg; c.fillRect(-E*1.2,480,360+E*2.4,400);
  const lg=c.createLinearGradient(-E,0,260,0); lg.addColorStop(0,'rgba(255,150,70,.3)'); lg.addColorStop(1,'rgba(255,150,70,0)');
  c.fillStyle=lg; c.fillRect(-E*1.2,480,360+E*2.4,400);
  // насыпь над бункером
  c.fillStyle='#24170e'; c.beginPath(); c.moveTo(130,482); c.quadraticCurveTo(170,330,240,318); c.lineTo(360+E*1.2,312); c.lineTo(360+E*1.2,482); c.closePath(); c.fill();
  c.strokeStyle='#3a2a18'; c.lineWidth=1.5;
  for(let i=0;i<22;i++){ const gx=150+i*12; const gy=gx<240?482-(gx-130)*1.4:316; c.beginPath(); c.moveTo(gx,gy+3); c.lineTo(gx+3,gy-5); c.stroke(); }
  // тень бункера на землю (вправо от вспышки)
  c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(190,482); c.lineTo(360+E*1.2,482); c.lineTo(360+E*1.2,520); c.lineTo(240,520); c.closePath(); c.fill();
  iFacade(c,E*1.2,0,272);
  // проём изнутри
  const ig=c.createRadialGradient(250,430,4,250,430,60); ig.addColorStop(0,'#4a3414'); ig.addColorStop(1,'#000');
  c.fillStyle=ig; c.fillRect(214,396,56,84);
  // мешки с песком
  for(let row=0;row<3;row++) for(let k=0;k<4-row;k++){
    const bx=148+k*16+row*8, by=476-row*9;
    c.fillStyle='#6a5236'; c.beginPath(); c.ellipse(bx,by,9,5,0,0,7); c.fill();

  // тени на стене: падают от лампы, растут и смещаются при её качании (мягкий край — 3 слоя)

    const off=(p.x+14-bx)*0.9;
    for(let l=0;l<3;l++){ c.save(); c.globalAlpha=0.16; iSeated(c,p.x+off+(l-1)*3,470-2,p.s*(1.5+l*0.04),Math.sin(u*3+i*2),p.k,'#000'); c.restore(); }

  c.fillStyle=lg; c.fillRect(-E,-500,360+2*E,1300); c.restore();

    iSeated(c,p.x+(bx>p.x?1.2:-1.2),469,p.s,Math.sin(u*3+i*2),p.k,'#ffcf8a'); c.restore();

  // провод и лампа

  const vg=c.createRadialGradient(180,330,120,180,330,460); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.85)');
  c.fillStyle=vg; c.fillRect(-E,-500,360+2*E,1300);

}

/* ---------- Звук ---------- */
function introAudio(){
  let ac=null;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const T=ac.currentTime;
    const noise=len=>{ const b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const n=ac.createBufferSource(); n.buffer=b; return n; };
    const env=(node,at,peak,dur)=>{ const g=ac.createGain(); g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(peak,at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,at+dur); node.connect(g).connect(ac.destination); };
    const filt=(type,f)=>{ const b=ac.createBiquadFilter(); b.type=type; b.frequency.value=f; return b; };
    // сирена (обрывается на вспышке)
    const o=ac.createOscillator(), lfo=ac.createOscillator(), lg=ac.createGain(), g=ac.createGain(), f=filt('lowpass',1600);
    o.type='sawtooth'; o.frequency.value=620; lfo.frequency.value=0.25; lg.gain.value=230;
    lfo.connect(lg).connect(o.frequency); o.connect(f).connect(g).connect(ac.destination);
    g.gain.setValueAtTime(0,T); g.gain.linearRampToValueAtTime(0.045,T+0.8); g.gain.setValueAtTime(0.045,T+7.38); g.gain.linearRampToValueAtTime(0,T+7.42);
    o.start(T); lfo.start(T); o.stop(T+7.5); lfo.stop(T+7.5);
    // шаги
    for(let s=T+3.5; s<T+12.2; s+=0.19){ const n=noise(0.06), lp=filt('lowpass',900); n.connect(lp); env(lp,s,0.06,0.06); n.start(s); }
    // взрыв (звук приходит позже вспышки)
    const n1=noise(4), lp1=filt('lowpass',380); n1.connect(lp1); env(lp1,T+8.6,0.9,3.8); n1.start(T+8.6);
    const th=ac.createOscillator(); th.frequency.setValueAtTime(55,T+8.6); th.frequency.exponentialRampToValueAtTime(25,T+10.2); env(th,T+8.6,0.6,1.8); th.start(T+8.6); th.stop(T+10.6);
    // ветер ударной волны
    const nw=noise(3.2), bw=filt('bandpass',320), gw=ac.createGain();
    gw.gain.setValueAtTime(0.0001,T+9.6); gw.gain.exponentialRampToValueAtTime(0.35,T+12.3); gw.gain.exponentialRampToValueAtTime(0.0001,T+12.6);
    nw.connect(bw).connect(gw).connect(ac.destination); nw.start(T+9.6);
    // гермодверь
    const n2=noise(0.6), lp2=filt('lowpass',700); n2.connect(lp2); env(lp2,T+12.45,0.8,0.5); n2.start(T+12.45);
    const cl=ac.createOscillator(); cl.type='triangle'; cl.frequency.value=140; env(cl,T+12.45,0.4,0.7); cl.start(T+12.45); cl.stop(T+13.3);
    // приглушённый гул внутри
    const n3=noise(4.5), lp3=filt('lowpass',120); n3.connect(lp3); env(lp3,T+12.6,0.35,4.4); n3.start(T+12.6);
  }catch(e){ ac=null; }
  return ac;
}

function pShotTitle(c,t,D,E){
  const u=t-18;

  c.fillStyle=bg; c.fillRect(-E,-500,360+2*E,1640);
  for(const d of D.dust){ const y=640-((d.y+u*d.v*2.2)%640), x=d.x+Math.sin(u*1.3+d.ph)*6; c.fillStyle=`rgba(255,${140+Math.floor(d.ph*15)},60,${0.25+0.4*Math.sin(d.ph+u*3)**2})`; c.fillRect(x,y,d.s*1.3,d.s*1.3); }
  const s=1.1-0.1*iSm(18,18.9,t);
  c.save(); c.translate(180,318); c.scale(s,s); c.textAlign='center';
  c.font='bold 54px Unbounded, "Arial Black", sans-serif';

  if(gl){ c.fillStyle='rgba(255,40,40,.8)'; c.fillText('БУНКЕР',-4,0); c.fillStyle='rgba(40,220,255,.7)'; c.fillText('БУНКЕР',4,2); }
  c.save(); c.shadowColor='rgba(255,138,61,.6)'; c.shadowBlur=26; c.fillStyle='#f2f0ea'; c.fillText('БУНКЕР',0,0); c.restore();
  c.restore();
  c.textAlign='center'; c.font='bold 11px Manrope, sans-serif'; c.fillStyle='rgba(255,255,255,.45)';

function drawPrologue(c,t,V){
  const D=introData(), {W,H,SC,OX,OY}=V, E=OX/SC+40;
  c.save(); c.fillStyle='#000'; c.fillRect(0,0,W,H);
  const amp = 6*iPulse(t,14.5,0.4) + 10*iPulse(t,18,0.8) + (t>10.8&&t<14.5 ? 1.2 : 0);
  const sx=(Math.sin(t*91.3)+Math.sin(t*53.7))*0.5*amp, sy=(Math.sin(t*77.1)+Math.sin(t*61.9))*0.5*amp;
  c.translate(OX+sx*SC, OY+sy*SC); c.scale(SC,SC);
  if(t<4.2) pShotText(c,t,E);
  else if(t<18) pShotRoom(c,t,D,E);
  else pShotTitle(c,t,D,E);
  c.restore();
  const dip=Math.max(0, ...[4.2,18].map(x=>1-Math.abs(t-x)/0.25), 1-iSm(0,0.6,t), iSm(21.3,22,t));
  if(dip>0){ c.fillStyle=`rgba(0,0,0,${dip})`; c.fillRect(0,0,W,H); }
  if(t>18 && t<18.15){ c.fillStyle=`rgba(255,240,220,${1-(t-18)/0.15})`; c.fillRect(0,0,W,H); }
  const bh=Math.round(H*0.075); c.fillStyle='#000'; c.fillRect(0,0,W,bh); c.fillRect(0,H-bh,W,bh);
  let cap=null, col='#d8e0c8';
  if(t>5 && t<10.2) cap=['22:31. Обычный вечер.'];
  else if(t>14.8 && t<17.9){ cap=['Пётр: «Бункер под гаражами!','Бери самое нужное — у нас 15 минут!»']; col='#ffb340'; }
  if(cap){
    const fs=Math.round(Math.min(16,W/24)); c.font=`bold ${fs}px "Courier New", monospace`; c.textAlign='center'; c.textBaseline='middle'; c.fillStyle=col;
    cap.forEach((l,i)=>c.fillText(l,W/2,H-bh/2+(i-(cap.length-1)/2)*(fs+3)));
    c.textBaseline='alphabetic';
  }
}

function prologueAudio(){
  let ac=null;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const T=ac.currentTime;
    const noise=len=>{ const b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const n=ac.createBufferSource(); n.buffer=b; return n; };
    const env=(node,at,peak,dur)=>{ const g=ac.createGain(); g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(peak,at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,at+dur); node.connect(g).connect(ac.destination); };
    const filt=(type,f,q)=>{ const b=ac.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q) b.Q.value=q; return b; };
    // низкий гул
    const dr=ac.createOscillator(), dl=filt('lowpass',220), dg=ac.createGain(); dr.type='sawtooth'; dr.frequency.value=55;
    dg.gain.setValueAtTime(0,T); dg.gain.linearRampToValueAtTime(0.035,T+2); dg.gain.setValueAtTime(0.035,T+17.5); dg.gain.linearRampToValueAtTime(0,T+18);
    dr.connect(dl).connect(dg).connect(ac.destination); dr.start(T); dr.stop(T+18.2);
    // часы
    for(let s=T+0.5; s<T+10.5; s+=1){ const n=noise(0.03), hp=filt('highpass',3000); n.connect(hp); env(hp,s,0.05,0.03); n.start(s); }
    // бормотание телевизора
    const tv=noise(6.3), bp=filt('bandpass',650,1.2), tg=ac.createGain(), lfo=ac.createOscillator(), lg=ac.createGain();
    tg.gain.value=0.025; lfo.frequency.value=4.2; lg.gain.value=0.02; lfo.connect(lg).connect(tg.gain);
    tv.connect(bp).connect(tg).connect(ac.destination); tv.start(T+4.2); lfo.start(T+4.2); lfo.stop(T+10.5);
    // помехи
    const st=noise(0.3), sh=filt('highpass',900); st.connect(sh); env(sh,T+10.5,0.22,0.3); st.start(T+10.5);
    // сигнал оповещения
    [10.9,11.3,11.7,12.7,13.1,13.5].forEach(o=>{ const b=ac.createOscillator(); b.frequency.value=880; env(b,T+o,0.1,0.14); b.start(T+o); b.stop(T+o+0.2); });
    // вибрация телефона
    for(let s=11.2; s<13.6; s+=0.8){ const v=ac.createOscillator(); v.type='square'; v.frequency.value=150; const lp=filt('lowpass',400); v.connect(lp); env(lp,T+s,0.05,0.38); v.start(T+s); v.stop(T+s+0.42); }
    // сирена снаружи
    const o=ac.createOscillator(), l2=ac.createOscillator(), lg2=ac.createGain(), f=filt('lowpass',900), g=ac.createGain();
    o.type='sawtooth'; o.frequency.value=600; l2.frequency.value=0.25; lg2.gain.value=220; l2.connect(lg2).connect(o.frequency); o.connect(f).connect(g).connect(ac.destination);
    g.gain.setValueAtTime(0,T+11.4); g.gain.linearRampToValueAtTime(0.04,T+12.2); g.gain.setValueAtTime(0.04,T+17.8); g.gain.linearRampToValueAtTime(0,T+18.4);
    o.start(T+11.4); l2.start(T+11.4); o.stop(T+18.6); l2.stop(T+18.6);
    // дверь
    const n1=noise(0.4), lp1=filt('lowpass',500); n1.connect(lp1); env(lp1,T+14.5,0.6,0.3); n1.start(T+14.5);
    const k=ac.createOscillator(); k.frequency.setValueAtTime(90,T+14.5); k.frequency.exponentialRampToValueAtTime(40,T+14.8); env(k,T+14.5,0.5,0.35); k.start(T+14.5); k.stop(T+15);
    // удар на титре
    const n2=noise(3), lp2=filt('lowpass',300); n2.connect(lp2); env(lp2,T+18,0.8,2.6); n2.start(T+18);
    const b2=ac.createOscillator(); b2.frequency.setValueAtTime(60,T+18); b2.frequency.exponentialRampToValueAtTime(28,T+20); env(b2,T+18,0.6,2.4); b2.start(T+18); b2.stop(T+20.6);
  }catch(e){ ac=null; }
  return ac;
}

/* ---------- общий проигрыватель роликов ---------- */
function runCutscene(draw, len, audioFn, buzzAt, done){
  const cv=document.createElement('canvas'); cv.id='cut';
  const skipBtn=document.createElement('button'); skipBtn.id='skip'; skipBtn.textContent='Пропустить ›';
  document.body.append(cv, skipBtn);
  const ctx=cv.getContext('2d');
  const V={};
  function resize(){
    const d=Math.min(2, window.devicePixelRatio||1);
    V.W=innerWidth; V.H=innerHeight; cv.width=V.W*d; cv.height=V.H*d; ctx.setTransform(d,0,0,d,0,0);
    V.SC=Math.min(V.W/360, V.H/640); V.OX=(V.W-360*V.SC)/2; V.OY=(V.H-640*V.SC)/2;
  }
  resize(); addEventListener('resize', resize);
  const ac=audioFn();
  const start=performance.now(), buzz={}; let raf=0, finished=false;
  function frame(now){
    const t=(now-start)/1000;
    draw(ctx,t,V);
    buzzAt.forEach(at=>{ if(t>at && !buzz[at]){ buzz[at]=1; haptic('heavy'); } });
    if(t>len) return finish();
    raf=requestAnimationFrame(frame);
  }
  function finish(){
    if(finished) return; finished=true;
    cancelAnimationFrame(raf); removeEventListener('resize', resize);
    try{ if(ac) ac.close(); }catch(e){}
    cv.style.opacity='0'; skipBtn.remove();
    setTimeout(()=>{ cv.remove(); done(); }, 600);
  }
  skipBtn.onclick=finish;
  raf=requestAnimationFrame(frame);
}
function playIntro(done){ runCutscene(drawIntro, INTRO_LEN, introAudio, [7.4,8.6,12.45], done); }
function playPrologue(done){ bgm.stop(); runCutscene(drawPrologue, PRO_LEN, prologueAudio, [10.8,14.5,18], done); }
function startPrologue(){ haptic('medium'); S.seenPrologue=1; playPrologue(()=>{ S.screen='pick'; go('pick'); }); }

load(raw=>{
  let saved=null;
  try{ saved = raw ? JSON.parse(raw) : null; }catch(e){}
  if(saved && saved.screen && saved.screen!=='ending' && saved.screen!=='pick'){
    S = migrate(saved); S.screen_prev = saved.screen; S.screen='title';
  } else {
    S = newState(); S.screen='start';
  }
  render();
});
